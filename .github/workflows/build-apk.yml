name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cai Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Kiem thu va build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/LookNote-build-${{ github.run_number }}.apk"
          cp lookai/build/outputs/apk/debug/lookai-debug.apk "dist/LookAI-build-${{ github.run_number }}.apk"

      - name: Luu APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: LookNote-apk
          path: dist/*.apk

      - name: Dang ban phat hanh de tai APK truc tiep
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LookNote + LookAI build ${{ github.run_number }}
          body: "Ban build tu dong. LookNote = so cong thuc mau; LookAI = chinh anh theo cong thuc + lam min da (Gemini). Cai tren Android 10 tro len."
          files: dist/*.apk
